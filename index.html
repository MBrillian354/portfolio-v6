<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="M. Brillian - Full Stack Developer & Data Science Enthusiast"
		/>
		<meta
			name="keywords"
			content="developer, full stack, data science, machine learning, React, Node.js"
		/>
		<title>M. Brillian</title>
		<script>
			// Apply the theme before first paint to avoid a flash of the wrong theme.
			// Dark mode is the default; only an explicit saved "light" choice opts out.
			(function () {
				try {
					if (localStorage.getItem("theme") !== "light") {
						document.documentElement.classList.add("dark");
					}
				} catch (error) {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
